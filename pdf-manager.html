<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Documentos PDF</title>
    <style>
        /* Variables de colores */
        :root {
            --primary-color: #3498db;
            --secondary-color: #2ecc71;
            --danger-color: #e74c3c;
            --dark-color: #2c3e50;
            --light-color: #ecf0f1;
        }
        
        /* Estilos generales */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
        }
        
        header {
            background-color: var(--dark-color);
            color: white;
            padding: 1rem;
            display: flex;
            align-items: center;
        }
        
        header h1 {
            margin: 0;
            font-size: 1.5rem;
        }
        
        .header-icon {
            margin-right: 10px;
            font-size: 1.5rem;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* Estilos para el área de carga */
        .upload-area {
            border: 2px dashed #ccc;
            border-radius: 10px;
            padding: 2rem;
            text-align: center;
            margin-bottom: 2rem;
            background-color: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .upload-area:hover {
            border-color: var(--primary-color);
            background-color: #f0f7ff;
        }
        
        .upload-icon {
            font-size: 3rem;
            color: var(--primary-color);
            margin-bottom: 1rem;
        }
        
        /* Estilos para botones */
        .btn {
            display: inline-block;
            font-weight: 400;
            text-align: center;
            vertical-align: middle;
            cursor: pointer;
            border: 1px solid transparent;
            padding: 0.5rem 1rem;
            font-size: 1rem;
            line-height: 1.5;
            border-radius: 0.25rem;
            transition: all 0.15s ease-in-out;
            text-decoration: none;
            margin: 0.25rem;
        }
        
        .btn-primary {
            color: #fff;
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }
        
        .btn-primary:hover {
            background-color: #2980b9;
        }
        
        .btn-success {
            color: #fff;
            background-color: var(--secondary-color);
            border-color: var(--secondary-color);
        }
        
        .btn-success:hover {
            background-color: #27ae60;
        }
        
        .btn-danger {
            color: #fff;
            background-color: var(--danger-color);
            border-color: var(--danger-color);
        }
        
        .btn-danger:hover {
            background-color: #c0392b;
        }
        
        /* Estilos para la vista previa de la imagen */
        .preview-container {
            display: none;
            margin: 1rem 0;
            padding: 1.5rem;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        
        .image-preview {
            max-width: 100%;
            max-height: 300px;
            display: block;
            margin: 0 auto 1.5rem;
            border-radius: 5px;
        }
        
        .form-group {
            margin-bottom: 1rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }
        
        .form-control {
            display: block;
            width: 100%;
            padding: 0.5rem;
            font-size: 1rem;
            border: 1px solid #ced4da;
            border-radius: 0.25rem;
            box-sizing: border-box;
        }
        
        /* Estilos para la galería de documentos */
        .documents-section {
            margin-top: 2rem;
        }
        
        .documents-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
        }
        
        .document-card {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: transform 0.3s ease;
        }
        
        .document-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .document-icon {
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f8f9fa;
            color: var(--primary-color);
            font-size: 3rem;
        }
        
        .document-info {
            padding: 1rem;
        }
        
        .document-title {
            margin: 0 0 0.5rem;
            font-size: 1rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .document-meta {
            font-size: 0.8rem;
            color: #6c757d;
            margin-bottom: 1rem;
        }
        
        .document-actions {
            display: flex;
            justify-content: space-between;
        }
        
        /* Estilos para el visor de PDF */
        .pdf-viewer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            z-index: 1000;
        }
        
        .pdf-viewer iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        .close-button {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 2rem;
            cursor: pointer;
            z-index: 1001;
        }
        
        /* Estilos para la cámara */
        .camera-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            z-index: 1000;
        }
        
        .camera-preview {
            width: 100%;
            height: calc(100% - 70px);
            object-fit: contain;
        }
        
        .camera-buttons {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 2rem;
        }
        
        /* Estilos para el loader */
        .loader-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }
        
        .loader {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Estilos para mensajes vacíos */
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: #6c757d;
        }
        
        .empty-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            color: #ced4da;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .documents-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
            
            .document-icon {
                height: 120px;
            }
        }
        
        /* Utilidades */
        .hidden {
            display: none;
        }
        
        .text-center {
            text-align: center;
        }
        
        .mt-4 {
            margin-top: 1.5rem;
        }
        
        .mb-2 {
            margin-bottom: 0.5rem;
        }
        
        .d-flex {
            display: flex;
        }
        
        .justify-content-center {
            justify-content: center;
        }
        
        .flex-column {
            flex-direction: column;
        }
        
        .align-items-center {
            align-items: center;
        }
        
        .w-100 {
            width: 100%;
        }
        
        /* Animaciones */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease;
        }
    </style>
</head>
<body>
    <!-- Cabecera -->
    <header>
        <div class="header-icon">📄</div>
        <h1>Gestor de Documentos PDF</h1>
    </header>
    
    <!-- Contenido principal -->
    <div class="container">
        <!-- Área de subida de archivos -->
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📤</div>
            <h3>Subir imagen o archivo PDF</h3>
            <p>Arrastra y suelta archivos aquí o haz clic para seleccionar</p>
            <div>
                <button class="btn btn-primary" id="selectFileBtn">
                    📁 Seleccionar archivo
                </button>
                <button class="btn btn-success" id="takePhotoBtn">
                    📷 Tomar foto
                </button>
            </div>
            <input type="file" id="fileInput" accept=".jpg,.jpeg,.png,.pdf" style="display:none">
        </div>
        
        <!-- Vista previa de imagen -->
        <div class="preview-container" id="previewContainer">
            <h3 class="text-center">Vista previa</h3>
            <img id="imagePreview" class="image-preview" alt="Vista previa">
            
            <div class="form-group">
                <label for="documentName">Nombre del documento</label>
                <input type="text" class="form-control" id="documentName" placeholder="Nombre del documento">
            </div>
            
            <div class="text-center mt-4">
                <button class="btn btn-primary" id="createPdfBtn">
                    📄 Crear PDF
                </button>
            </div>
        </div>
        
        <!-- Documentos guardados -->
        <div class="documents-section">
            <h2>Mis documentos</h2>
            <div id="documentsContainer">
                <!-- Contenido generado dinámicamente -->
            </div>
        </div>
    </div>
    
    <!-- Visor de PDF -->
    <div class="pdf-viewer" id="pdfViewer">
        <div class="close-button" id="closePdfViewer">✕</div>
        <iframe id="pdfFrame"></iframe>
    </div>
    
    <!-- Contenedor de la cámara -->
    <div class="camera-container" id="cameraContainer">
        <video id="cameraPreview" class="camera-preview" autoplay playsinline></video>
        <div class="camera-buttons">
            <button class="btn btn-danger" id="closeCameraBtn">❌ Cancelar</button>
            <button class="btn btn-primary" id="capturePhotoBtn">📸 Capturar</button>
        </div>
    </div>
    
    <!-- Loader -->
    <div class="loader-container" id="loaderContainer">
        <div class="loader"></div>
    </div>
    
    <script>
        // Elementos del DOM
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const selectFileBtn = document.getElementById('selectFileBtn');
        const takePhotoBtn = document.getElementById('takePhotoBtn');
        const previewContainer = document.getElementById('previewContainer');
        const imagePreview = document.getElementById('imagePreview');
        const documentName = document.getElementById('documentName');
        const createPdfBtn = document.getElementById('createPdfBtn');
        const documentsContainer = document.getElementById('documentsContainer');
        const pdfViewer = document.getElementById('pdfViewer');
        const pdfFrame = document.getElementById('pdfFrame');
        const closePdfViewer = document.getElementById('closePdfViewer');
        const cameraContainer = document.getElementById('cameraContainer');
        const cameraPreview = document.getElementById('cameraPreview');
        const capturePhotoBtn = document.getElementById('capturePhotoBtn');
        const closeCameraBtn = document.getElementById('closeCameraBtn');
        const loaderContainer = document.getElementById('loaderContainer');
        
        // Variables globales
        let currentFile = null;
        let cameraStream = null;
        
        // Event Listeners
        document.addEventListener('DOMContentLoaded', function() {
            loadDocuments();
            setupEventListeners();
        });
        
        function setupEventListeners() {
            // Evento para seleccionar archivo
            selectFileBtn.addEventListener('click', function() {
                fileInput.click();
            });
            
            fileInput.addEventListener('change', handleFileSelection);
            
            // Eventos de arrastrar y soltar
            uploadArea.addEventListener('dragover', function(e) {
                e.preventDefault();
                uploadArea.style.borderColor = 'var(--primary-color)';
                uploadArea.style.backgroundColor = '#f0f7ff';
            });
            
            uploadArea.addEventListener('dragleave', function() {
                uploadArea.style.borderColor = '#ccc';
                uploadArea.style.backgroundColor = 'white';
            });
            
            uploadArea.addEventListener('drop', function(e) {
                e.preventDefault();
                uploadArea.style.borderColor = '#ccc';
                uploadArea.style.backgroundColor = 'white';
                
                if (e.dataTransfer.files.length) {
                    fileInput.files = e.dataTransfer.files;
                    handleFileSelection({target: fileInput});
                }
            });
            
            // Evento para tomar foto
            takePhotoBtn.addEventListener('click', openCamera);
            capturePhotoBtn.addEventListener('click', capturePhoto);
            closeCameraBtn.addEventListener('click', closeCamera);
            
            // Evento para crear PDF
            createPdfBtn.addEventListener('click', createPDF);
            
            // Evento para cerrar el visor de PDF
            closePdfViewer.addEventListener('click', function() {
                pdfViewer.style.display = 'none';
                pdfFrame.src = '';
            });
        }

                // Mostrar vista previa para imagen
                const reader = new FileReader();
                reader.onload = function(event) {
                    imagePreview.src = event.target.result;
                };
                reader.readAsDataURL(file);
            } else {
                alert('Formato de archivo no admitido. Por favor, selecciona una imagen o un PDF.');
                return;
            }
            
            // Sugerir un nombre para el documento
            const fileName = file.name.split('.')[0] || 'Documento';
            documentName.value = `${fileName}_${formatDate(new Date())}`;
            
            // Mostrar el contenedor de vista previa
            previewContainer.style.display = 'block';
        }
        
        // Función para abrir la cámara
        function openCamera() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                alert('Tu navegador no soporta el acceso a la cámara');
                return;
            }
            
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
                .then(function(stream) {
                    cameraStream = stream;
                    cameraPreview.srcObject = stream;
                    cameraContainer.style.display = 'block';
                })
                .catch(function(error) {
                    console.error('Error al acceder a la cámara:', error);
                    alert('No se pudo acceder a la cámara. Verifica los permisos.');
                });
        }
        
        // Función para cerrar la cámara
        function closeCamera() {
            if (cameraStream) {
                cameraStream.getTracks().forEach(function(track) {
                    track.stop();
                });
                cameraStream = null;
            }
            cameraContainer.style.display = 'none';
        }
        
        // Función para capturar una foto
        function capturePhoto() {
            if (!cameraStream) return;
            
            const canvas = document.createElement('canvas');
            canvas.width = cameraPreview.videoWidth;
            canvas.height = cameraPreview.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(cameraPreview, 0, 0, canvas.width, canvas.height);
            
            // Obtener la imagen como URL de datos
            const imageUrl = canvas.toDataURL('image/jpeg');
            imagePreview.src = imageUrl;
            
            // Convertir a Blob/File
            canvas.toBlob(function(blob) {
                currentFile = new File([blob], 'camera_photo.jpg', { type: 'image/jpeg' });
                
                // Sugerir un nombre para el documento
                documentName.value = `Foto_${formatDate(new Date())}`;
                
                // Mostrar el contenedor de vista previa
                previewContainer.style.display = 'block';
            }, 'image/jpeg');
            
            // Cerrar la cámara
            closeCamera();
        }
        
        // Función para crear un PDF
        function createPDF() {
            if (!currentFile) {
                alert('No hay ningún archivo seleccionado');
                return;
            }
            
            const name = documentName.value.trim() || `Documento_${formatDate(new Date())}`;
            
            // Mostrar el loader
            loaderContainer.style.display = 'flex';
            
            if (currentFile.type === 'application/pdf') {
                // Si es un PDF, guardarlo directamente
                saveDocument(currentFile, name);
            } else {
                // Si es una imagen, convertirla a PDF
                convertImageToPdf(currentFile, name);
            }
        }
        
        // Función para convertir imagen a PDF (implementación básica)

            // Por ahora, usaremos un enfoque simplificado para demostración
            
            const reader = new FileReader();
            reader.onload = function(e) {
                // Simular la creación de un PDF
                setTimeout(function() {
                    // En una implementación real, crearíamos un PDF real aquí
                    // Para esta demostración, solo guardamos la imagen como si
